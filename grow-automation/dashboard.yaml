# ============================================================================
# MAGIC GARDEN - Dashboard Lovelace PREMIUM
# ============================================================================
# Interface ultra-moderne pour monitoring et contrôle de la culture
# ============================================================================

title: Magic Garden 🌱
theme: default
views:

  # ==========================================================================
  # VUE 1: OVERVIEW - Vue d'ensemble
  # ==========================================================================
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    badges: []
    cards:

      # Header avec infos principales
      - type: custom:mushroom-template-card
        primary: "🌱 Watermelon x OG Kush Auto"
        secondary: |
          Jour {{ states('sensor.jour_de_culture') }} • Semaine {{ states('sensor.semaine_de_culture') }}
          {{ states('input_select.grow_phase') }}
        icon: mdi:cannabis
        icon_color: |
          {% if is_state('sensor.etat_sante_plante', 'Optimal') %}
            green
          {% elif 'Attention' in states('sensor.etat_sante_plante') %}
            orange
          {% else %}
            red
          {% endif %}
        badge_icon: |
          {% if is_state('binary_sensor.besoin_arrosage', 'on') %}
            mdi:water-alert
          {% else %}
            mdi:check-circle
          {% endif %}
        badge_color: |
          {% if is_state('binary_sensor.besoin_arrosage', 'on') %}
            orange
          {% else %}
            green
          {% endif %}
        tap_action:
          action: none
        hold_action:
          action: none
        layout: horizontal
        fill_container: false

      # Conditions environnementales - Cartes gauges modernes
      - type: horizontal-stack
        cards:
          # Température
          - type: gauge
            entity: sensor.capteur_4en1_temperature
            name: Température
            unit: "°C"
            min: 10
            max: 35
            severity:
              green: 18
              yellow: 16
              red: 0
            segments:
              - from: 0
                color: "#3498db"
              - from: 16
                color: "#2ecc71"
              - from: 22
                color: "#27ae60"
              - from: 26
                color: "#f39c12"
              - from: 30
                color: "#e74c3c"

          # Humidité air
          - type: gauge
            entity: sensor.capteur_4en1_humidite_air
            name: Humidité Air
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 35
              yellow: 60
              red: 65
            segments:
              - from: 0
                color: "#e74c3c"
              - from: 35
                color: "#2ecc71"
              - from: 45
                color: "#27ae60"
              - from: 55
                color: "#f39c12"
              - from: 65
                color: "#e74c3c"

          # Humidité sol
          - type: gauge
            entity: sensor.capteur_4en1_humidite_sol
            name: Humidité Sol
            unit: "%"
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: "#e74c3c"
              - from: 20
                color: "#f39c12"
              - from: 30
                color: "#2ecc71"
              - from: 70
                color: "#3498db"
              - from: 80
                color: "#e74c3c"

      # Cartes capteurs avec barres de progression
      - type: vertical-stack
        cards:
          - type: custom:bar-card
            entities:
              - entity: sensor.capteur_4en1_temperature
                name: Température
                icon: mdi:thermometer
                unit_of_measurement: "°C"
                min: 10
                max: 35
                target: 23
                severity:
                  - color: "#3498db"
                    from: 10
                    to: 16
                  - color: "#2ecc71"
                    from: 16
                    to: 26
                  - color: "#f39c12"
                    from: 26
                    to: 30
                  - color: "#e74c3c"
                    from: 30
                    to: 35
              - entity: sensor.capteur_4en1_humidite_air
                name: Humidité Air
                icon: mdi:water-percent
                unit_of_measurement: "%"
                min: 0
                max: 100
                target: 50
                severity:
                  - color: "#e74c3c"
                    from: 0
                    to: 35
                  - color: "#2ecc71"
                    from: 35
                    to: 60
                  - color: "#f39c12"
                    from: 60
                    to: 70
                  - color: "#e74c3c"
                    from: 70
                    to: 100
              - entity: sensor.capteur_4en1_humidite_sol
                name: Humidité Sol
                icon: mdi:water
                unit_of_measurement: "%"
                min: 0
                max: 100
                target: sensor.seuil_humidite_actif
                severity:
                  - color: "#e74c3c"
                    from: 0
                    to: 20
                  - color: "#f39c12"
                    from: 20
                    to: 30
                  - color: "#2ecc71"
                    from: 30
                    to: 70
                  - color: "#3498db"
                    from: 70
                    to: 100
            height: 40px
            width: 70%
            positions:
              icon: outside
              indicator: inside
              name: inside
            style: |-
              bar-card-currentbar, bar-card-targetbar {
                border-radius: 12px;
              }

      # VPD et Luminosité
      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.vpd
            name: VPD
            icon: mdi:cloud-percent
            graph: line
            detail: 2
            hours_to_show: 24
            theme: default

          - type: sensor
            entity: sensor.capteur_4en1_luminosite
            name: Luminosité
            icon: mdi:brightness-6
            graph: line
            detail: 2
            hours_to_show: 24

      # État de santé et besoin d'arrosage
      - type: glance
        entities:
          - entity: sensor.etat_sante_plante
            name: État de santé
          - entity: binary_sensor.besoin_arrosage
            name: Besoin arrosage
          - entity: sensor.seuil_humidite_actif
            name: Seuil actif
          - entity: counter.watering_count
            name: Arrosages total
        show_state: true
        columns: 4

      # Graphique température 24h
      - type: custom:apexcharts-card
        header:
          show: true
          title: "🌡️ Température (24h)"
          show_states: true
        graph_span: 24h
        span:
          start: day
        yaxis:
          - id: temp
            min: 10
            max: 35
            apex_config:
              tickAmount: 5
        series:
          - entity: sensor.capteur_4en1_temperature
            name: Température
            stroke_width: 3
            type: area
            color: "#e74c3c"
            opacity: 0.3
            yaxis_id: temp
        annotations:
          yaxis:
            - y: 16
              borderColor: "#3498db"
              strokeDashArray: 3
              label:
                text: "Min"
                style:
                  background: "#3498db"
            - y: 30
              borderColor: "#e74c3c"
              strokeDashArray: 3
              label:
                text: "Max"
                style:
                  background: "#e74c3c"

      # Graphique humidité air + sol
      - type: custom:apexcharts-card
        header:
          show: true
          title: "💧 Humidité Air & Sol (24h)"
          show_states: true
        graph_span: 24h
        yaxis:
          - id: humidity
            min: 0
            max: 100
            apex_config:
              tickAmount: 5
        series:
          - entity: sensor.capteur_4en1_humidite_air
            name: Humidité Air
            stroke_width: 3
            type: line
            color: "#3498db"
            yaxis_id: humidity
          - entity: sensor.capteur_4en1_humidite_sol
            name: Humidité Sol
            stroke_width: 3
            type: line
            color: "#27ae60"
            yaxis_id: humidity
          - entity: sensor.seuil_humidite_actif
            name: Seuil actif
            stroke_width: 2
            type: line
            color: "#f39c12"
            yaxis_id: humidity
            curve: stepline
        annotations:
          yaxis:
            - y: 60
              borderColor: "#e74c3c"
              strokeDashArray: 5
              label:
                text: "Max Air"
                style:
                  background: "#e74c3c"

      # Contrôles rapides
      - type: entities
        title: ⚡ Contrôles rapides
        show_header_toggle: false
        entities:
          - entity: switch.prise_mars_hydro
            name: Mars Hydro TS-1000
            icon: mdi:lightbulb-on
            secondary_info: last-changed
          - entity: switch.prise_extraction
            name: Extracteur + Filtre
            icon: mdi:fan
            secondary_info: last-changed
          - entity: switch.smart_drip_irrigation
            name: Pompe irrigation
            icon: mdi:water-pump
            secondary_info: last-changed
          - type: divider
          - entity: input_boolean.auto_watering_enabled
            name: Arrosage automatique
            icon: mdi:water-sync
          - entity: input_boolean.alerts_enabled
            name: Alertes activées
            icon: mdi:bell-ring

  # ==========================================================================
  # VUE 2: MONITORING DÉTAILLÉ
  # ==========================================================================
  - title: Monitoring
    path: monitoring
    icon: mdi:chart-line
    badges:
      - entity: sensor.jour_de_culture
      - entity: sensor.semaine_de_culture
      - entity: input_select.grow_phase
      - entity: sensor.etat_sante_plante
    cards:

      # Graphique température 7 jours
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.capteur_4en1_temperature
            name: Température
            color: "#e74c3c"
        name: 🌡️ Température (7 jours)
        hours_to_show: 168
        points_per_hour: 2
        line_width: 3
        font_size: 75
        animate: true
        show:
          extrema: true
          average: true
          fill: fade
        upper_bound: 35
        lower_bound: 10
        color_thresholds:
          - value: 10
            color: "#3498db"
          - value: 16
            color: "#2ecc71"
          - value: 26
            color: "#f39c12"
          - value: 30
            color: "#e74c3c"

      # Plages optimales température
      - type: markdown
        content: |
          ### 🌡️ Plages optimales température

          | Phase | Jour | Nuit |
          |-------|------|------|
          | 🌱 Germination | 22-26°C | 18-20°C |
          | 🌿 Plantule | 22-25°C | 18-20°C |
          | 🌿 Végétation | 23-25°C | 18-22°C |
          | 🌸 Floraison | 25°C | 18-20°C |
          | 💧 Rinçage | 25°C | 18-20°C |

      # Graphique humidité air 7 jours
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.capteur_4en1_humidite_air
            name: Humidité Air
            color: "#3498db"
        name: 💧 Humidité Air (7 jours)
        hours_to_show: 168
        points_per_hour: 2
        line_width: 3
        font_size: 75
        animate: true
        show:
          extrema: true
          average: true
          fill: fade
        upper_bound: 100
        lower_bound: 0
        color_thresholds:
          - value: 0
            color: "#e74c3c"
          - value: 35
            color: "#2ecc71"
          - value: 60
            color: "#f39c12"
          - value: 70
            color: "#e74c3c"

      # Plages optimales humidité air
      - type: markdown
        content: |
          ### 💧 Plages optimales humidité air

          | Phase | Humidité |
          |-------|----------|
          | 🌱 Germination | 70-80% |
          | 🌿 Plantule | 55-65% |
          | 🌿 Végétation | 45-55% |
          | 🌸 **Floraison** | **38-45% MAX** ⚠️ |
          | 💧 Rinçage | 35-40% |

          ⚠️ **En floraison : MAX 45% sinon risque de moisissure!**

      # Graphique humidité sol + seuil
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.capteur_4en1_humidite_sol
            name: Humidité Sol
            color: "#27ae60"
          - entity: sensor.seuil_humidite_actif
            name: Seuil actif
            color: "#f39c12"
            show_line: true
            show_points: false
            show_legend: true
        name: 🏜️ Humidité Sol vs Seuil (7 jours)
        hours_to_show: 168
        points_per_hour: 1
        line_width: 3
        font_size: 75
        animate: true
        show:
          extrema: true
          average: true
          fill: fade
        upper_bound: 100
        lower_bound: 0
        color_thresholds:
          - value: 0
            color: "#e74c3c"
          - value: 20
            color: "#f39c12"
          - value: 30
            color: "#2ecc71"

      # Seuils humidité sol
      - type: markdown
        content: |
          ### 🏜️ Seuils d'arrosage par phase

          | Phase | Seuil | Volume |
          |-------|-------|--------|
          | 🌱 Germination | 75% | Substrat humide |
          | 🌿 Plantule | 70% | 100ml |
          | 🌿 Végétation | 50% | 500ml |
          | 🌸 Floraison | 40% | 1000ml |
          | 💧 Rinçage | 55% | 2000ml |

      # Graphique VPD
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.vpd
            name: VPD
            color: "#9b59b6"
        name: 🌫️ VPD - Vapor Pressure Deficit (24h)
        hours_to_show: 24
        points_per_hour: 4
        line_width: 3
        font_size: 75
        animate: true
        show:
          extrema: true
          average: true
          fill: fade
        color_thresholds:
          - value: 0
            color: "#3498db"
          - value: 0.4
            color: "#e74c3c"
          - value: 0.8
            color: "#2ecc71"
          - value: 1.2
            color: "#27ae60"
          - value: 1.5
            color: "#f39c12"

      # VPD explications
      - type: markdown
        content: |
          ### 🌫️ VPD optimal

          | Phase | VPD optimal | Explication |
          |-------|-------------|-------------|
          | 🌿 Végétation | 0.8-1.0 kPa | Croissance rapide |
          | 🌸 Floraison | 1.0-1.2 kPa | Formation têtes |

          **Trop bas (<0.4)** : Risque moisissure
          **Trop haut (>1.5)** : Stress hydrique

      # Graphique luminosité
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.capteur_4en1_luminosite
            name: Luminosité
            color: "#f1c40f"
        name: 💡 Luminosité (24h)
        hours_to_show: 24
        points_per_hour: 4
        line_width: 3
        font_size: 75
        animate: true
        show:
          extrema: true
          average: true
          fill: fade

  # ==========================================================================
  # VUE 3: ARROSAGE
  # ==========================================================================
  - title: Arrosage
    path: watering
    icon: mdi:water-pump
    badges:
      - entity: binary_sensor.besoin_arrosage
      - entity: sensor.volume_arrosage_estime
      - entity: counter.watering_count
      - entity: input_boolean.auto_watering_enabled
    cards:

      # Info phase actuelle
      - type: custom:mushroom-title-card
        title: "💧 Système d'arrosage automatique"
        subtitle: "Phase: {{ states('input_select.grow_phase') }} • Jour {{ states('sensor.jour_de_culture') }}"

      # Configuration principale
      - type: entities
        title: ⚙️ Configuration
        show_header_toggle: false
        entities:
          - entity: input_select.grow_phase
            name: Phase de culture
            icon: mdi:sprout
          - entity: input_datetime.grow_start_date
            name: Date germination
            icon: mdi:calendar
          - type: divider
          - entity: sensor.jour_de_culture
            name: Jour
            icon: mdi:calendar-today
          - entity: sensor.semaine_de_culture
            name: Semaine
            icon: mdi:calendar-week

      # Stats arrosage avec cartes colorées
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.capteur_4en1_humidite_sol
            name: Humidité Sol
            icon: mdi:water
            icon_color: |
              {% set humid = states('sensor.capteur_4en1_humidite_sol') | float %}
              {% set seuil = states('sensor.seuil_humidite_actif') | float %}
              {% if humid < 20 %}
                red
              {% elif humid < seuil %}
                orange
              {% else %}
                green
              {% endif %}
            tap_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: sensor.seuil_humidite_actif
            name: Seuil Actif
            icon: mdi:water-percent
            icon_color: blue
            tap_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: counter.watering_count
            name: Arrosages
            icon: mdi:counter
            icon_color: purple
            tap_action:
              action: more-info

      # Indicateur besoin arrosage
      - type: conditional
        conditions:
          - entity: binary_sensor.besoin_arrosage
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "💧 ARROSAGE NÉCESSAIRE"
          secondary: |
            Humidité sol: {{ states('sensor.capteur_4en1_humidite_sol') }}%
            Seuil: {{ states('sensor.seuil_humidite_actif') }}%
          icon: mdi:water-alert
          icon_color: orange
          badge_icon: mdi:alert
          badge_color: orange
          tap_action:
            action: none

      # Contrôle arrosage
      - type: entities
        title: 🎮 Contrôle
        show_header_toggle: false
        entities:
          - entity: input_boolean.auto_watering_enabled
            name: Arrosage automatique
            icon: mdi:water-sync
          - type: divider
          - entity: switch.smart_drip_irrigation
            name: Smart Drip (manuel)
            icon: mdi:water-pump
          - type: divider
          - entity: sensor.duree_arrosage_active
            name: Durée active
            icon: mdi:timer
          - entity: sensor.volume_arrosage_estime
            name: Volume estimé
            icon: mdi:cup-water

      # Alarmes Smart Drip
      - type: entities
        title: 🚨 Alarmes Smart Drip
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.smart_drip_alarme_eau
            name: Réservoir vide
            icon: mdi:water-alert
          - entity: binary_sensor.smart_drip_alarme_obstruction
            name: Obstruction goutteurs
            icon: mdi:pipe-leak

      # Recette engrais
      - type: custom:mushroom-template-card
        primary: "🧪 {{ states('input_text.fertilizer_recipe') }}"
        secondary: "Phase: {{ states('input_select.grow_phase') }} • Semaine {{ states('sensor.semaine_de_culture') }}"
        icon: mdi:beaker
        icon_color: green
        tap_action:
          action: none
        layout: vertical

      # Tableau volumes par phase
      - type: markdown
        content: |
          ### 💧 Volumes d'arrosage par phase

          | Phase | Volume | Fréquence | Durée |
          |-------|--------|-----------|-------|
          | 🌱 Germination | 0ml | Substrat humide | 0s |
          | 🌿 Plantule | **100ml** | 2-3 jours | 45s |
          | 🌿 Végétation | **500ml** | 2 jours | 225s |
          | 🌸 Floraison | **1000ml** | 2 jours | 450s |
          | 💧 Rinçage | **2000ml** | 2 jours | 900s |

          **Débit actuel:** {{ states('input_number.dripper_flow_rate') }}ml/min × 4 goutteurs

      # Seuils et durées
      - type: entities
        title: 🎚️ Seuils humidité sol
        show_header_toggle: false
        entities:
          - entity: input_number.humidity_threshold_germination
          - entity: input_number.humidity_threshold_plantule
          - entity: input_number.humidity_threshold_vegetation
          - entity: input_number.humidity_threshold_floraison
          - entity: input_number.humidity_threshold_rincage
          - type: divider
          - entity: input_number.soil_humidity_critical
            name: Seuil critique

      - type: entities
        title: ⏱️ Durées arrosage
        show_header_toggle: false
        entities:
          - entity: input_number.watering_duration_germination
          - entity: input_number.watering_duration_plantule
          - entity: input_number.watering_duration_vegetation
          - entity: input_number.watering_duration_floraison
          - entity: input_number.watering_duration_rincage
          - type: divider
          - entity: input_number.dripper_flow_rate

      # Historique arrosages
      - type: history-graph
        title: 💦 Historique arrosages (7 jours)
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: switch.smart_drip_irrigation
            name: Pompe arrosage

      # Tableau récapitulatif engrais
      - type: markdown
        content: |
          ### 🧪 Tableau engrais BioBizz

          | Semaine | Root Juice | Bio Grow | Bio Bloom | pH |
          |---------|-----------|----------|-----------|-----|
          | 1 | - | - | - | 6.2-6.5 |
          | 2 | 1ml/L | 0.5ml/L | - | 6.2-6.5 |
          | 3-4 | 2ml/L | 1-2ml/L | - | 6.3-6.8 |
          | 5-6 | - | 2ml/L | 2ml/L | 6.3-6.8 |
          | 7-8 | - | 3ml/L | 3ml/L | 6.5-7.0 |
          | 9-11 | - | - | - | 6.5 |

          ⚠️ **Semaine 5 : STOP Root Juice!**
          ⚠️ **Semaine 9-11 : EAU CLAIRE uniquement (rinçage)**

          💡 **pH = 6.5 toujours!** Prépare ton eau la veille.

  # ==========================================================================
  # VUE 4: ÉQUIPEMENTS
  # ==========================================================================
  - title: Équipements
    path: equipment
    icon: mdi:devices
    badges: []
    cards:

      # Contrôle équipements avec cartes modernes
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.prise_mars_hydro
            name: Mars Hydro
            icon: mdi:lightbulb-on
            icon_color: |
              {% if is_state('switch.prise_mars_hydro', 'on') %}
                amber
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: switch.prise_extraction
            name: Extraction
            icon: mdi:fan
            icon_color: |
              {% if is_state('switch.prise_extraction', 'on') %}
                blue
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: switch.smart_drip_irrigation
            name: Smart Drip
            icon: mdi:water-pump
            icon_color: |
              {% if is_state('switch.smart_drip_irrigation', 'on') %}
                cyan
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: toggle
            hold_action:
              action: more-info

      # État capteurs
      - type: entities
        title: 📡 Capteurs 4-en-1
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.capteur_4en1_temperature
            name: Température
            icon: mdi:thermometer
            secondary_info: last-changed
          - entity: sensor.capteur_4en1_humidite_air
            name: Humidité air
            icon: mdi:water-percent
            secondary_info: last-changed
          - entity: sensor.capteur_4en1_humidite_sol
            name: Humidité sol
            icon: mdi:water
            secondary_info: last-changed
          - entity: sensor.capteur_4en1_luminosite
            name: Luminosité
            icon: mdi:brightness-6
            secondary_info: last-changed

      # Historique équipements
      - type: history-graph
        title: 📊 Historique équipements (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: switch.prise_mars_hydro
            name: Mars Hydro
          - entity: switch.prise_extraction
            name: Extraction
          - entity: switch.smart_drip_irrigation
            name: Smart Drip

      # Réglages Mars Hydro
      - type: markdown
        content: |
          ### 💡 Réglages Mars Hydro TS-1000 (100W)

          **Hauteur selon phase:**

          | Phase | Semaines | Hauteur | Cycle |
          |-------|----------|---------|-------|
          | 🌱 Semis/Plantule | 1-2 | **50-60 cm** | 18h/6h |
