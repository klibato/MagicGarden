  - title: Guide
    path: guide
    icon: mdi:book-open-variant
    badges: []
    cards:

      - type: markdown
        content: |
          # 🌱 GUIDE DE CULTURE COMPLET
          ## Watermelon Automatic - Royal Queen Seeds

          ---

          ### 📊 INFORMATIONS GÉNÉTIQUES

          - **Génétique:** Tropicanna Cookies x Lemon OG
          - **Type:** 75% Indica / 20% Sativa / 5% Ruderalis
          - **THC:** 20%
          - **CBD:** Moyen
          - **Cycle total:** 10-12 semaines (avec rinçage)
          - **Floraison:** 6-7 semaines
          - **Hauteur indoor:** 80-110 cm
          - **Rendement indoor:** 450-500 g/m² (50-80g/plant réaliste)
          - **Effet:** Relaxant, calming, euphorique
          - **Goût:** Pastèque, fruité, tropical 🍉

          ---

          ### 🌱 PHASE 1: Semis (Semaine 1)

          | Paramètre | Valeur |
          |-----------|--------|
          | 🌡️ Température | 22-26°C |
          | 💧 Humidité air | 70-80% |
          | 💡 Lumière | TS-1000 à 50-60cm, 18-24h/jour |
          | 💦 Arrosage | Substrat humide, pas trempé |
          | 🧪 Engrais | Aucun |
          | 📏 Hauteur | ~5 cm en fin de semaine |

          ---

          ### 🌿 PHASE 2: Plantule (Semaine 2)

          | Paramètre | Valeur |
          |-----------|--------|
          | 🌡️ Température | 22-25°C jour / 18-20°C nuit |
          | 💧 Humidité air | 55-65% |
          | 💡 Lumière | TS-1000 à 50cm, 18-24h/jour |
          | 💦 Arrosage | **100ml tous les 2-3 jours**, autour de la tige |
          | 🧪 Engrais | Root Juice 1ml/L - pH 6.2-6.5 |
          | 📏 Hauteur | ~10 cm en fin de semaine |

          ---

          ### 🌿 PHASE 3: Végétation (Semaines 3-4)

          | Paramètre | Valeur |
          |-----------|--------|
          | 🌡️ Température | 23-25°C jour / 18-22°C nuit |
          | 💧 Humidité air | 45-55% |
          | 💡 Lumière | TS-1000 à 40-45cm, 18-24h/jour |
          | 💦 Arrosage | **500ml-1L tous les 2 jours** |
          | 🧪 Engrais | Root Juice 2ml/L + Bio Grow 1-2ml/L - pH 6.3-6.8 |
          | 📏 Hauteur | 20-30 cm, pistils apparaissent fin sem. 4 |

          ℹ️ **C'est le moment idéal pour le LST si tu veux!**
          La plante double de taille cette semaine.

          ---

          ### 🌸 PHASE 4: Floraison (Semaines 5-8)

          | Paramètre | Valeur |
          |-----------|--------|
          | 🌡️ Température | 25°C jour / 18-20°C nuit |
          | 💧 Humidité air | **38-45% MAX** ⚠️ |
          | 💡 Lumière | TS-1000 à 30-40cm, 18-20h/jour |
          | 💦 Arrosage | **1-2L tous les 2 jours** |
          | 🧪 Sem 5-6 | Bio Grow 2ml/L + Bio Bloom 2ml/L - pH 6.3-6.8 |
          | 🧪 Sem 7-8 | Bio Grow 3ml/L + Bio Bloom 3ml/L - pH 6.5-7.0 |
          | 📏 Hauteur | 60-80 cm, têtes gonflent, arômes forts |

          ⚠️ **STOP le Root Juice!**
          ⚠️ **Humidité MAX 45%!**
          ⚠️ **Extracteur + filtre charbon OBLIGATOIRES!**

          ---

          ### 💧 PHASE 5: Rinçage (Semaines 9-11)

          Le rinçage dure 2-3 semaines. La plante utilise ses réserves = fumée plus douce.

          | Paramètre | Valeur |
          |-----------|--------|
          | 🌡️ Température | 25°C jour / 18-20°C nuit |
          | 💧 Humidité air | 35-40% |
          | 💡 Lumière | TS-1000 à 30-35cm, 18-20h/jour |
          | 💦 Arrosage | **2L tous les 2 jours** |
          | 🧪 Engrais | **AUCUN — EAU CLAIRE UNIQUEMENT!** |
          | 🍂 Observation | Feuilles jaunissent = NORMAL ✅ |

          ---

          ### 🔍 RÉCOLTE (Semaine 12)

          **Observe les trichomes avec une loupe:**

          | Trichomes | État | Effet |
          |-----------|------|-------|
          | Transparents | ❌ Trop tôt | Pas prêt |
          | Laiteux/blancs | ✅ Bon | High énergique |
          | **70% laiteux + 30% ambrés** | **⭐ PARFAIT** | **High équilibré** |
          | Majoritairement ambrés | ⚠️ Tard | Effet sédatif, couch-lock |

          ---

          ### 🌿 SÉCHAGE (10-14 jours)

          1. Coupe la plante à la base
          2. Suspends tête en bas dans un endroit **SOMBRE**
          3. Laisse le ventilateur tourner, éteins les lampes
          4. **Conditions:** 18-22°C, 50-60% humidité
          5. **Durée:** 10-14 jours
          6. **Test:** Les petites branches doivent **CASSER**, pas plier

          ---

          ### 🏺 AFFINAGE / CURING (2-8 semaines)

          1. Mets les buds manucurés dans des pots en verre (Mason jars)
          2. **Semaine 1:** ouvre les pots 2x par jour pendant 10-15 min (burping)
          3. **Semaines 2-4:** ouvre 1x par jour
          4. **Minimum:** 2 semaines
          5. **Idéalement:** 4-8 semaines

          ℹ️ **Le curing améliore énormément le goût et la puissance!**

          ---

          ### ⚠️ ERREURS À ÉVITER

          | Erreur | Conséquence | Solution |
          |--------|-------------|----------|
          | Trop arroser | Racines noyées, mort | Attends que le pot soit LÉGER |
          | Oublier le pH | Nutriments bloqués | pH 6.5 À CHAQUE ARROSAGE |
          | Trop d'engrais | Brûlure des feuilles | Commence doucement |
          | Humidité haute en flo | Moisissure buds | Max 45%, extracteur! |
          | Pas de rinçage | Goût chimique | 2-3 semaines eau claire |
          | Récolter trop tôt | Pas de puissance | Vérifie les trichomes! |

          ---

          ### 💡 CONSEILS PRO

          - **SOULÈVE TON POT** pour savoir quand arroser — pot léger = arrose!
          - Feuilles qui tombent légèrement = besoin d'eau
          - Feuilles jaunes du BAS en floraison = NORMAL
          - Le grow report a obtenu 56g sur 1 plant — c'est un objectif réaliste!
          - Défolie les feuilles malades pour améliorer l'aération
          - Les couleurs violettes apparaissent naturellement sur cette variété!

          ---

          ### 📊 BONNE CULTURE!

          | Paramètre | Valeur |
          |-----------|--------|
          | **Durée totale** | 10-12 semaines |
          | **Rendement réaliste** | 50-80g par plant |
          | **THC** | 20% |
          | **Effet** | Relaxant, yeux rouges, appétit 😋 |
